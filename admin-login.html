<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Amin Optical Service</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="admin-login-container">

        <div class="admin-login-box">

            <h1>Admin Login</h1>

            <p>Sign in to manage Amin Optical Service.</p>

            <form id="loginForm">

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

                <p id="loginError"></p>

            </form>

        </div>

    </div>


    <script type="module">

        import {
            auth,
            signInWithEmailAndPassword
        } from "./firebase.js";


        const loginForm =
            document.getElementById("loginForm");


        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    document.getElementById(
                        "adminEmail"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "adminPassword"
                    ).value;


                const errorMessage =
                    document.getElementById(
                        "loginError"
                    );


                errorMessage.textContent = "";


                try {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                    window.location.href =
                        "admin.html";


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    errorMessage.textContent =
    error.code + " — " + error.message;

                }

            }
        );

    </script>

</body>
</html>
